<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>อนุมัติพาร์ทเนอร์ | Admin แม่ยมพาเลส</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
body { padding-bottom: 40px; }
.page-wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px; }
.page-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.page-title { font-family: 'Cormorant Garamond', serif; font-size: 28px; color: var(--color-emerald); font-weight: 600; }

.tabs { display: flex; gap: 0; border-bottom: 2px solid var(--color-line); margin-bottom: 20px; }
.tab-btn { padding: 10px 20px; border: none; background: none; font-family: 'Sarabun', sans-serif; font-size: 15px; font-weight: 600; color: var(--color-muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all .15s; }
.tab-btn.active { color: var(--color-emerald); border-bottom-color: var(--color-gold); }
.tab-content { display: none; }
.tab-content.active { display: block; }

.partner-card {
  background: #fff; border-radius: 14px; overflow: hidden;
  box-shadow: 0 2px 12px rgba(0,0,0,.06); margin-bottom: 16px;
  border: 1px solid var(--color-line);
}
.partner-card-head {
  display: flex; align-items: center; gap: 14px;
  padding: 16px; border-bottom: 1px solid var(--color-line);
}
.partner-logo {
  width: 56px; height: 56px; border-radius: 12px;
  background: var(--color-cream); display: flex; align-items: center; justify-content: center;
  font-size: 28px; flex-shrink: 0; overflow: hidden;
}
.partner-logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 9px; }
.partner-name { font-family: 'Cormorant Garamond', serif; font-size: 20px; color: var(--color-emerald); font-weight: 600; }
.partner-id { font-size: 12px; color: var(--color-muted); margin-top: 2px; }
.partner-badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; margin-left: auto; }
.badge-pending  { background: #FEF3C7; color: #92400E; }
.badge-approved { background: #D1FAE5; color: #065F46; }
.badge-rejected { background: #FEE2E2; color: #991B1B; }

.partner-details { padding: 14px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.detail-row { font-size: 13px; }
.detail-label { color: var(--color-stone); font-weight: 600; }
.detail-val { color: var(--color-charcoal); }

.partner-banner-preview {
  width: 100%; height: 80px;
  background: linear-gradient(135deg, var(--color-emerald-dark), var(--color-emerald));
  background-size: cover; background-position: center;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; color: rgba(255,255,255,.5);
}

.partner-actions { display: flex; gap: 8px; padding: 12px 16px; background: var(--color-cream); }
.btn-approve {
  flex: 1; padding: 11px; background: #10B981; color: #fff;
  border: none; border-radius: 10px; font-family: 'Sarabun', sans-serif;
  font-size: 14px; font-weight: 700; cursor: pointer; transition: all .2s;
}
.btn-approve:hover { background: #059669; }
.btn-reject {
  padding: 11px 18px; background: #FEE2E2; color: #991B1B;
  border: none; border-radius: 10px; font-family: 'Sarabun', sans-serif;
  font-size: 14px; font-weight: 700; cursor: pointer; transition: all .2s;
}
.btn-reject:hover { background: #FCA5A5; }
.btn-revoke {
  padding: 11px 18px; background: #FEF3C7; color: #92400E;
  border: none; border-radius: 10px; font-family: 'Sarabun', sans-serif;
  font-size: 14px; font-weight: 700; cursor: pointer;
}
.btn-edit {
  padding: 11px 16px; background: #EFF6FF; color: #1D4ED8;
  border: none; border-radius: 10px; font-family: 'Sarabun', sans-serif;
  font-size: 14px; font-weight: 700; cursor: pointer; transition: all .2s;
}
.btn-edit:hover { background: #DBEAFE; }
.btn-delete {
  padding: 11px 13px; background: #FEE2E2; color: #991B1B;
  border: none; border-radius: 10px; font-family: 'Sarabun', sans-serif;
  font-size: 14px; font-weight: 700; cursor: pointer; transition: all .2s;
}
.btn-delete:hover { background: #FCA5A5; }

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; padding: 16px;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.modal-overlay.show { opacity: 1; pointer-events: all; }
.modal-box {
  background: #fff; border-radius: 18px; width: 100%; max-width: 540px;
  max-height: 90vh; overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,.25);
  transform: translateY(20px); transition: transform .2s;
}
.modal-overlay.show .modal-box { transform: translateY(0); }
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px; border-bottom: 1px solid var(--color-line);
}
.modal-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; color: var(--color-emerald); font-weight: 600; }
.modal-close {
  width: 32px; height: 32px; border-radius: 50%; border: none;
  background: var(--color-cream); color: var(--color-muted);
  font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: var(--color-cream-dark, #e8e0d4); }
.modal-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-label { font-size: 13px; font-weight: 600; color: var(--color-stone); }
.form-input {
  padding: 10px 12px; border: 1.5px solid var(--color-line); border-radius: 10px;
  font-family: 'Sarabun', sans-serif; font-size: 14px; color: var(--color-charcoal);
  transition: border-color .15s;
}
.form-input:focus { outline: none; border-color: var(--color-emerald); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-footer {
  padding: 16px 20px; border-top: 1px solid var(--color-line);
  display: flex; gap: 10px; justify-content: flex-end;
}
.btn-save {
  padding: 11px 28px; background: var(--color-emerald); color: #fff;
  border: none; border-radius: 10px; font-family: 'Sarabun', sans-serif;
  font-size: 14px; font-weight: 700; cursor: pointer;
}
.btn-save:hover { filter: brightness(1.1); }
.btn-cancel-modal {
  padding: 11px 20px; background: var(--color-cream); color: var(--color-charcoal);
  border: none; border-radius: 10px; font-family: 'Sarabun', sans-serif;
  font-size: 14px; font-weight: 600; cursor: pointer;
}
.pass-reset-row { display: flex; gap: 8px; align-items: flex-end; }
.pass-reset-row .form-input { flex: 1; }
.btn-gen-pass {
  padding: 10px 12px; background: var(--color-cream); border: 1.5px solid var(--color-line);
  border-radius: 10px; font-family: 'Sarabun', sans-serif; font-size: 12px;
  font-weight: 600; cursor: pointer; white-space: nowrap; color: var(--color-charcoal);
}
.btn-gen-pass:hover { background: var(--color-cream-dark, #e8e0d4); }

.empty-state { text-align: center; padding: 60px 20px; color: var(--color-muted); }
.empty-state .ico { font-size: 56px; margin-bottom: 12px; }

.spinner-wrap { display: flex; align-items: center; justify-content: center; padding: 60px; }
.spinner { width: 36px; height: 36px; border: 3px solid var(--color-cream-dark); border-top-color: var(--color-emerald); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--color-emerald-dark); color: #fff; padding: 12px 24px;
  border-radius: 12px; font-size: 14px; font-weight: 600;
  box-shadow: 0 8px 24px rgba(0,0,0,.2); z-index: 999;
  animation: toastIn .3s ease; display: none; white-space: nowrap;
}
@keyframes toastIn { from { opacity:0; transform: translateX(-50%) translateY(10px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="admin.html" class="brand-link" title="กลับหน้าแรก">
      <img src="images/logo-white.png" class="brand-logo-img" alt="Logo">
    </a>
    <nav class="topbar-nav">
      <a href="index.html">🏠 หน้าแรก</a>
      <a href="admin.html">ออเดอร์</a>
      <a href="menu-manage.html">เมนู</a>
      <a href="partner-admin-approve.html" class="active">🤝 พาร์ทเนอร์</a>
    </nav>
  </div>
</header>

<div class="page-wrap">
  <div class="page-head">
    <div class="page-title">🤝 จัดการพาร์ทเนอร์</div>
    <button onclick="loadAll()" style="padding:8px 16px;border:1.5px solid var(--color-line);border-radius:8px;background:#fff;font-family:'Sarabun',sans-serif;font-size:13px;font-weight:600;cursor:pointer;">🔄 รีเฟรช</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('pending')">⏳ รออนุมัติ <span id="count-pending"></span></button>
    <button class="tab-btn" onclick="switchTab('approved')">✅ อนุมัติแล้ว <span id="count-approved"></span></button>
    <button class="tab-btn" onclick="switchTab('all')">📋 ทั้งหมด</button>
  </div>

  <div class="tab-content active" id="tab-pending">
    <div class="spinner-wrap"><div class="spinner"></div></div>
  </div>
  <div class="tab-content" id="tab-approved">
    <div class="spinner-wrap"><div class="spinner"></div></div>
  </div>
  <div class="tab-content" id="tab-all">
    <div class="spinner-wrap"><div class="spinner"></div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/admin-pin.js"></script>
<script>
let allPartners = [];
let activeTab = 'pending';

document.addEventListener('DOMContentLoaded', () => {
  if (!checkConfig()) return;
  loadAll();
});

async function loadAll() {
  try {
    const data = await API.call('getPartners', {});
    allPartners = data.partners || [];
    renderTab('pending');
    renderTab('approved');
    renderTab('all');
    updateCounts();
  } catch (err) {
    showToast('โหลดล้มเหลว: ' + err.message, 'error');
  }
}

function updateCounts() {
  const pending  = allPartners.filter(p => p.isActive && !p.isApproved).length;
  const approved = allPartners.filter(p => p.isActive && p.isApproved).length;
  document.getElementById('count-pending').textContent  = pending  ? `(${pending})`  : '';
  document.getElementById('count-approved').textContent = approved ? `(${approved})` : '';
}

function renderTab(tab) {
  let partners;
  if (tab === 'pending')  partners = allPartners.filter(p => p.isActive && !p.isApproved);
  if (tab === 'approved') partners = allPartners.filter(p => p.isActive && p.isApproved);
  if (tab === 'all')      partners = allPartners;

  const el = document.getElementById('tab-' + tab);
  if (partners.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="ico">${tab === 'pending' ? '🎉' : '🏪'}</div><p>${tab === 'pending' ? 'ไม่มีพาร์ทเนอร์รออนุมัติ' : 'ยังไม่มีพาร์ทเนอร์'}</p></div>`;
    return;
  }
  el.innerHTML = partners.map(partnerCard).join('');
}

function partnerCard(p) {
  const isPending  = p.isActive && !p.isApproved;
  const isApproved = p.isActive && p.isApproved;
  const badge = isPending  ? '<span class="partner-badge badge-pending">⏳ รออนุมัติ</span>'
              : isApproved ? '<span class="partner-badge badge-approved">✅ อนุมัติแล้ว</span>'
              : '<span class="partner-badge badge-rejected">❌ ปิดใช้งาน</span>';

  return `
  <div class="partner-card">
    ${p.bannerUrl ? `<div class="partner-banner-preview" style="background-image:url('${p.bannerUrl}');background-size:cover;background-position:center;"></div>` : ''}
    <div class="partner-card-head">
      <div class="partner-logo">
        ${p.logoUrl ? `<img src="${p.logoUrl}">` : '🏪'}
      </div>
      <div>
        <div class="partner-name">${esc(p.partnerName)}</div>
        <div class="partner-id">ID: ${esc(p.partnerId)} · ${esc(p.category || '')}</div>
      </div>
      ${badge}
    </div>
    <div class="partner-details">
      <div class="detail-row"><span class="detail-label">📞 เบอร์: </span><span class="detail-val">${esc(p.phone || '-')}</span></div>
      <div class="detail-row"><span class="detail-label">📍 ที่ตั้ง: </span><span class="detail-val">${esc(p.location || '-')}</span></div>
      ${p.description ? `<div class="detail-row" style="grid-column:1/-1"><span class="detail-label">📝 รายละเอียด: </span><span class="detail-val">${esc(p.description)}</span></div>` : ''}
      <div class="detail-row"><span class="detail-label">🕐 สมัครเมื่อ: </span><span class="detail-val">${p.createdAt ? new Date(p.createdAt).toLocaleDateString('th-TH') : '-'}</span></div>
    </div>
    <div class="partner-actions">
      ${isPending ? `
        <button class="btn-approve" onclick="approvePartner('${p.partnerId}', '${esc(p.partnerName)}')">✅ อนุมัติ — แสดงบนเว็บทันที</button>
        <button class="btn-reject" onclick="rejectPartner('${p.partnerId}')">❌ ปฏิเสธ</button>
      ` : isApproved ? `
        <span style="flex:1;font-size:13px;color:#065F46;font-weight:600;">✅ แสดงบนเว็บแล้ว</span>
        <button class="btn-edit" onclick="openEditModal('${p.partnerId}')">✏️ แก้ไข</button>
        <button class="btn-revoke" onclick="rejectPartner('${p.partnerId}')">⏸️ ระงับ</button>
        <button class="btn-delete" onclick="deletePartner('${p.partnerId}', '${esc(p.partnerName)}')">🗑️</button>
      ` : `
        <button class="btn-approve" onclick="approvePartner('${p.partnerId}', '${esc(p.partnerName)}')">🔄 เปิดใช้งานอีกครั้ง</button>
        <button class="btn-edit" onclick="openEditModal('${p.partnerId}')">✏️ แก้ไข</button>
        <button class="btn-delete" onclick="deletePartner('${p.partnerId}', '${esc(p.partnerName)}')">🗑️ ลบ</button>
      `}
    </div>
  </div>`;
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', ['pending','approved','all'][i] === tab);
  });
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
}

async function approvePartner(partnerId, name) {
  if (!confirm(`อนุมัติ "${name}" ?\nร้านจะแสดงบนหน้าเว็บทันที`)) return;
  try {
    await API.call('approvePartner', { partnerId, approvedBy: 'admin' });
    const p = allPartners.find(x => x.partnerId === partnerId);
    if (p) p.isApproved = true;
    renderTab('pending'); renderTab('approved'); renderTab('all');
    updateCounts();
    showToast('✅ อนุมัติแล้ว — ' + name + ' จะแสดงบนเว็บทันที');
  } catch (err) {
    showToast('❌ ' + err.message, 'error');
  }
}

async function rejectPartner(partnerId) {
  if (!confirm('ปฏิเสธ / ระงับพาร์ทเนอร์นี้?')) return;
  try {
    await API.call('rejectPartner', { partnerId });
    const p = allPartners.find(x => x.partnerId === partnerId);
    if (p) { p.isApproved = false; p.isActive = false; }
    renderTab('pending'); renderTab('approved'); renderTab('all');
    updateCounts();
    showToast('ระงับพาร์ทเนอร์แล้ว', 'info');
  } catch (err) {
    showToast('❌ ' + err.message, 'error');
  }
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  t.style.background = type === 'error' ? '#991B1B' : type === 'info' ? '#651713' : '#10B981';
  setTimeout(() => { t.style.display = 'none'; }, 3000);
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])
  );
}
// ── Edit Partner ──────────────────────────────────
function openEditModal(partnerId) {
  const p = allPartners.find(x => x.partnerId === partnerId);
  if (!p) return;
  document.getElementById('edit-partner-id').value  = p.partnerId;
  document.getElementById('edit-name').value         = p.partnerName || '';
  document.getElementById('edit-phone').value        = p.phone || '';
  document.getElementById('edit-location').value     = p.location || '';
  document.getElementById('edit-description').value  = p.description || '';
  document.getElementById('edit-password').value     = '';
  const catSel = document.getElementById('edit-category');
  for (let opt of catSel.options) {
    opt.selected = opt.value === (p.category || 'อาหาร');
  }
  document.getElementById('modal-edit').classList.add('show');
}

function closeEditModal() {
  document.getElementById('modal-edit').classList.remove('show');
}

// ปิด modal เมื่อคลิกพื้นหลัง
document.getElementById('modal-edit').addEventListener('click', function(e) {
  if (e.target === this) closeEditModal();
});

function genPassword() {
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let pwd = '';
  for (let i = 0; i < 8; i++) pwd += chars[Math.floor(Math.random() * chars.length)];
  document.getElementById('edit-password').value = pwd;
}

async function saveEditPartner() {
  const partnerId   = document.getElementById('edit-partner-id').value;
  const partnerName = document.getElementById('edit-name').value.trim();
  const phone       = document.getElementById('edit-phone').value.trim();
  const location    = document.getElementById('edit-location').value.trim();
  const description = document.getElementById('edit-description').value.trim();
  const category    = document.getElementById('edit-category').value;
  const newPassword = document.getElementById('edit-password').value.trim();

  if (!partnerName) { showToast('❌ กรุณากรอกชื่อร้าน', 'error'); return; }

  const btn = document.getElementById('btn-save-edit');
  btn.disabled = true; btn.textContent = 'กำลังบันทึก...';

  const payload = { partnerId, partnerName, phone, location, description, category };
  if (newPassword) payload.newPassword = newPassword;

  try {
    await API.call('updatePartner', payload);
    // อัปเดต local state
    const p = allPartners.find(x => x.partnerId === partnerId);
    if (p) {
      p.partnerName = partnerName;
      p.phone = phone;
      p.location = location;
      p.description = description;
      p.category = category;
    }
    closeEditModal();
    renderTab('pending'); renderTab('approved'); renderTab('all');
    showToast('✅ บันทึกข้อมูลพาร์ทเนอร์แล้ว');
  } catch (err) {
    showToast('❌ ' + err.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = '💾 บันทึก';
  }
}

// ── Delete Partner ────────────────────────────────
async function deletePartner(partnerId, name) {
  if (!confirm(`⚠️ ลบพาร์ทเนอร์ "${name}" ?\n\nการลบจะลบข้อมูลทั้งหมดออกจากระบบถาวร\nกด OK เพื่อยืนยัน`)) return;
  try {
    await API.call('deletePartner', { partnerId });
    allPartners = allPartners.filter(x => x.partnerId !== partnerId);
    renderTab('pending'); renderTab('approved'); renderTab('all');
    updateCounts();
    showToast('🗑️ ลบพาร์ทเนอร์แล้ว', 'info');
  } catch (err) {
    showToast('❌ ' + err.message, 'error');
  }
}

</script>
<!-- ── Edit Partner Modal ── -->
<div class="modal-overlay" id="modal-edit">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title">✏️ แก้ไขข้อมูลพาร์ทเนอร์</div>
      <button class="modal-close" onclick="closeEditModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit-partner-id">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">🏪 ชื่อร้าน</label>
          <input class="form-input" id="edit-name" placeholder="ชื่อร้าน">
        </div>
        <div class="form-group">
          <label class="form-label">🏷️ ประเภท</label>
          <select class="form-input" id="edit-category">
            <option value="อาหาร">อาหาร</option>
            <option value="เครื่องดื่ม">เครื่องดื่ม</option>
            <option value="ของหวาน">ของหวาน</option>
            <option value="อื่นๆ">อื่นๆ</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">📞 เบอร์โทร</label>
          <input class="form-input" id="edit-phone" placeholder="0812345678">
        </div>
        <div class="form-group">
          <label class="form-label">📍 ที่ตั้ง</label>
          <input class="form-input" id="edit-location" placeholder="อาคาร / ชั้น / ห้อง">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">📝 รายละเอียด</label>
        <input class="form-input" id="edit-description" placeholder="คำอธิบายร้านโดยย่อ">
      </div>
      <div class="form-group">
        <label class="form-label">🔑 รีเซ็ตรหัสผ่าน <span style="font-weight:400;color:var(--color-muted)">(เว้นว่างถ้าไม่ต้องการเปลี่ยน)</span></label>
        <div class="pass-reset-row">
          <input class="form-input" id="edit-password" type="text" placeholder="รหัสผ่านใหม่ (เว้นว่าง = ไม่เปลี่ยน)">
          <button class="btn-gen-pass" onclick="genPassword()">🎲 สุ่ม</button>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel-modal" onclick="closeEditModal()">ยกเลิก</button>
      <button class="btn-save" id="btn-save-edit" onclick="saveEditPartner()">💾 บันทึก</button>
    </div>
  </div>
</div>

</body>
</html>
