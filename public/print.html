<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ปริ้นออเดอร์</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap');

  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Sarabun',-apple-system,sans-serif; background:#e9e9e9; color:#000; padding:20px; }

  .receipt {
    width: 80mm;
    background: #fff;
    margin: 0 auto;
    padding: 6mm 5mm;
    font-size: 12pt;
    line-height: 1.3;
    box-shadow: 0 4px 16px rgba(0,0,0,.15);
  }
  .receipt.w58 { width: 58mm; font-size: 10pt; }

  .center { text-align:center; }
  .right { text-align:right; }
  .bold { font-weight:700; }
  .lg { font-size:1.4em; }
  .xl { font-size:1.7em; font-weight:700; }
  .muted { color:#444; font-size:.85em; }
  .hr { border-top:1px dashed #000; margin:6px 0; }
  .hr2 { border-top:1px solid #000; margin:6px 0; }
  .row { display:flex; justify-content:space-between; gap:8px; }
  .item { margin: 4px 0; }
  .item .top { display:flex; justify-content:space-between; gap:8px; }
  .item .name { flex:1; font-weight:600; }
  .item .qty { white-space:nowrap; }
  .item .price { white-space:nowrap; min-width:60px; text-align:right; }
  .item .note { font-size:.85em; color:#444; padding-left:6px; margin-top:2px; }
  .stamp { display:inline-block; padding:3px 10px; border:2px solid #000; border-radius:4px; font-weight:700; }

  .toolbar { max-width:80mm; margin:0 auto 16px; display:flex; gap:8px; }
  .toolbar button {
    flex:1; padding:10px; border:none; border-radius:6px; cursor:pointer;
    font-family:inherit; font-weight:600; font-size:14px;
  }
  .btn-print { background:#651713; color:#fff; }
  .btn-back { background:#fff; color:#651713; border:1px solid #651713 !important; }
  .btn-58 { background:#C9A861; color:#fff; }

  #loading { text-align:center; padding:40px; color:#666; }
  #error { text-align:center; padding:40px; color:#c33; }

  /* QR Payment */
  .qr-section { text-align:center; margin:8px 0 4px; }
  .qr-section img { width:140px; height:140px; display:block; margin:6px auto; border:1px solid #ddd; border-radius:6px; }
  .qr-label { font-size:.85em; color:#444; margin-top:4px; }
  .qr-amount { font-size:1.1em; font-weight:700; color:#000; margin-top:2px; }
  .btn-qr { background:#1a56a0; color:#fff; }
  .btn-qr.active { background:#15803d; }

  @media print {
    body { background:#fff; padding:0; }
    .toolbar { display:none !important; }
    .receipt { box-shadow:none; margin:0; padding:4mm; }
    @page { margin: 0; size: 80mm auto; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <button class="btn-back" id="btnClose">ปิด</button>
  <button class="btn-58" id="btnSize">ขนาด 58/80mm</button>
  <button class="btn-qr" id="btnQR">💳 QR จ่ายเงิน</button>
  <button class="btn-print" id="btnPrint">🖨️ ปริ้น</button>
</div>

<div id="receipt" class="receipt">
  <div id="loading">กำลังโหลดออเดอร์...</div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
  // ต้องอยู่ระดับ global เพื่อให้ renderReceipt เข้าถึงได้
  let showQR = false;
  let currentOrder = null;

document.addEventListener('DOMContentLoaded', async function() {

  // Bind buttons
  document.getElementById('btnClose').addEventListener('click', () => window.close());
  document.getElementById('btnSize').addEventListener('click', () => {
    document.getElementById('receipt').classList.toggle('w58');
  });
  document.getElementById('btnPrint').addEventListener('click', () => window.print());
  document.getElementById('btnQR').addEventListener('click', () => {
    showQR = !showQR;
    const btn = document.getElementById('btnQR');
    btn.textContent = showQR ? '✅ QR เปิดอยู่' : '💳 QR จ่ายเงิน';
    btn.classList.toggle('active', showQR);
    if (currentOrder) renderReceipt(currentOrder);
  });

  if (!checkConfig()) return;

  const params = new URLSearchParams(window.location.search);
  const orderId = params.get('id');
  const autoPrint = params.get('auto') === '1';

  if (!orderId) {
    document.getElementById('receipt').innerHTML = '<div id="error">⚠️ ไม่มี Order ID</div>';
    return;
  }

  try {
    const order = await API.getOrder(orderId);
    currentOrder = order;
    renderReceipt(order);
    if (autoPrint) {
      setTimeout(() => { window.print(); }, 500);
    }
  } catch (err) {
    console.error(err);
    document.getElementById('receipt').innerHTML = '<div id="error">⚠️ ไม่พบออเดอร์<br><small style="color:#888;">' + err.message + '</small></div>';
  }
});

function renderReceipt(order) {
  const orderTypeLabel = order.order_type === 'takeaway' ? '🥡 กลับบ้าน' : '🍽️ กินที่นี่';
  const orderTypeBig   = order.order_type === 'takeaway' ? 'TAKEAWAY' : 'DINE-IN';
  const dt = new Date(order.created_at);
  const dateStr = dt.toLocaleDateString('th-TH', { year:'numeric', month:'short', day:'numeric' });
  const timeStr = dt.toLocaleTimeString('th-TH', { hour:'2-digit', minute:'2-digit' });

  const items = order.items || [];
  let itemsHtml = items.map(it => {
    const name = it.name || 'รายการ';
    const qty = it.quantity || 1;
    const sub = (Number(it.price) * qty).toFixed(0);
    return `
      <div class="item">
        <div class="top">
          <div class="name">${qty}× ${escapeHtml(name)}</div>
          <div class="price">${sub}</div>
        </div>
        ${it.note ? `<div class="note">📝 ${escapeHtml(it.note)}</div>` : ''}
      </div>`;
  }).join('');

  const total = Number(order.total_amount || 0).toFixed(0);
  const totalQty = items.reduce((s, it) => s + (it.quantity || 0), 0);

  const html = `
    <div class="center">
      <img src="images/logo.png" style="height:56px;width:auto;margin-bottom:4px;" alt="Logo">
      <div class="bold lg">${escapeHtml(CONFIG.HOTEL_NAME)}</div>
      <div class="muted">${escapeHtml(CONFIG.HOTEL_NAME_EN || '')}</div>
      <div class="muted">โทร ${escapeHtml(CONFIG.HOTEL_PHONE || '')}</div>
    </div>

    <div class="hr2"></div>

    <div class="center">
      <div class="stamp">${orderTypeBig}</div>
    </div>

    <div class="hr"></div>

    <div class="row"><span>เลขที่ออเดอร์</span><span class="bold">${escapeHtml(order.order_number || String(order.id).slice(0,8))}</span></div>
    <div class="row"><span>วันที่</span><span>${dateStr} ${timeStr}</span></div>
    <div class="row"><span>ประเภท</span><span class="bold">${orderTypeLabel}</span></div>
    ${order.table_number ? `<div class="row"><span>โต๊ะ</span><span class="bold xl">${order.table_number}</span></div>` : ''}

    <div class="hr"></div>

    <div class="bold">ลูกค้า</div>
    <div class="row"><span>ชื่อ</span><span>${escapeHtml(order.customer_name || '-')}</span></div>
    <div class="row"><span>โทร</span><span>${escapeHtml(order.customer_phone || '-')}</span></div>

    <div class="hr2"></div>

    <div class="bold">รายการอาหาร (${totalQty} รายการ)</div>
    <div class="hr"></div>
    ${itemsHtml || '<div class="muted">ไม่มีรายการ</div>'}

    <div class="hr2"></div>

    <div class="row lg bold">
      <span>รวมทั้งสิ้น</span>
      <span>฿${total}</span>
    </div>

    ${order.notes ? `
      <div class="hr"></div>
      <div class="bold">หมายเหตุ:</div>
      <div>${escapeHtml(order.notes)}</div>
    ` : ''}

    <div class="hr2"></div>

    ${showQR ? renderQRSection(total) : ''}

    <div class="center muted" style="margin-top:6px;">
      ขอบคุณที่ใช้บริการ<br>
      Thank you for your visit ✨
    </div>

    <div class="center muted" style="margin-top:6px;font-size:.8em;">
      ${dt.toLocaleString('th-TH')}
    </div>
  `;

  document.getElementById('receipt').innerHTML = html;
}

function renderQRSection(total) {
  // ลำดับ: 1) QR อัปโหลดแล้ว  2) PromptPay API
  const uploadedImg   = localStorage.getItem('paymentQR_image');
  const uploadedLabel = localStorage.getItem('paymentQR_label') || 'สแกนจ่ายผ่านแอปธนาคาร';

  if (uploadedImg) {
    return `
    <div class="qr-section">
      <div class="bold" style="font-size:.9em;">📲 ชำระเงิน</div>
      <img src="${uploadedImg}" alt="QR จ่ายเงิน" />
      <div class="qr-label">${escapeHtml(uploadedLabel)}</div>
      <div class="qr-amount">฿${total}</div>
    </div>
    <div class="hr2"></div>`;
  }

  if (CONFIG.PROMPTPAY_ID) {
    return `
    <div class="qr-section">
      <div class="bold" style="font-size:.9em;">📲 ชำระเงินผ่านพร้อมเพย์</div>
      <img src="https://promptpay.io/${encodeURIComponent(CONFIG.PROMPTPAY_ID)}/${total}.png"
           alt="QR พร้อมเพย์" onerror="this.src='';this.alt='ไม่สามารถโหลด QR ได้';" />
      <div class="qr-label">สแกนจ่ายผ่านแอปธนาคาร</div>
      <div class="qr-amount">฿${total}</div>
    </div>
    <div class="hr2"></div>`;
  }

  return `
    <div class="qr-section" style="color:#c33;font-size:.85em;padding:8px;">
      ⚠️ ยังไม่ได้ตั้งค่า QR จ่ายเงิน<br>
      <small>ไปที่ <a href="payment-qr.html">หน้า QR จ่าย</a> เพื่ออัปโหลด</small>
    </div>
    <div class="hr2"></div>`;
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>

</body>
</html>
