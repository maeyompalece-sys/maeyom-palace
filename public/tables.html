<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จัดการโต๊ะ - แม่ยมพาเลส</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  .page-wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 80px; }
  .page-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
  .page-head h1 { font-family:'Cormorant Garamond',serif; color:var(--color-emerald); font-size:32px; margin:0; }
  .page-head .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .tables-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
  .table-card { background:#fff; border:1px solid var(--color-line); border-radius:14px; padding:18px; text-align:center; transition:all .2s; position:relative; }
  .table-card:hover { box-shadow:0 8px 24px rgba(101,23,19,.08); transform:translateY(-2px); }
  .table-card.inactive { opacity:.5; }
  .table-card .num { font-family:'Cormorant Garamond',serif; font-size:48px; font-weight:600; color:var(--color-emerald); line-height:1; margin-bottom:4px; }
  .table-card .name { color:var(--color-gold); font-weight:600; font-size:14px; margin-bottom:2px; min-height:18px; }
  .table-card .seats { color:var(--color-muted); font-size:12px; margin-bottom:12px; }
  .table-card .qr-box { background:#fafaf6; border-radius:10px; padding:10px; margin-bottom:10px; display:flex; align-items:center; justify-content:center; min-height:140px; }
  .table-card .qr-box canvas, .table-card .qr-box img { display:block; max-width:100%; height:auto; }
  .table-card .row-btns { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
  .table-card .row-btns button { font-size:12px; padding:6px 10px; }
  .table-card .badge-off { position:absolute; top:8px; right:8px; background:#fee; color:#c33; font-size:10px; padding:2px 8px; border-radius:10px; font-weight:600; }
  .empty-state { text-align:center; padding:60px 20px; color:var(--color-muted); }
  .empty-state .ico { font-size:64px; margin-bottom:12px; }
  /* Print size picker */
  .print-size-bar { display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .size-btn { padding:6px 16px; border-radius:20px; border:1.5px solid var(--color-line); background:#fff; font-size:13px; font-weight:700; cursor:pointer; color:var(--color-emerald); transition:all .15s; }
  .size-btn.active { background:var(--color-emerald); color:#C9A861; border-color:var(--color-emerald); }

  /* Print all view */
  #printAllView { display:none; }

  /* === Card design (เหมือน qr-print.html) === */
  .print-card {
    page-break-inside:avoid; break-inside:avoid;
    overflow:hidden; border-radius:10px;
    border:1px solid #ddd;
    display:flex; flex-direction:column;
    font-family:'Sarabun',sans-serif;
  }
  .pc-header {
    background:linear-gradient(160deg,#651713 0%,#4A0E0E 100%);
    padding:12px 14px 10px; text-align:center;
  }
  .pc-header img { height:52px; width:auto; margin-bottom:4px; display:block; margin-left:auto; margin-right:auto; }
  .pc-hotel { font-family:'Cormorant Garamond',serif; font-size:15px; font-weight:700; color:#C9A861; letter-spacing:.5px; }
  .pc-sub { font-size:9px; color:rgba(255,255,255,.65); }
  .pc-badge {
    display:inline-block; margin-top:7px;
    background:rgba(201,168,97,.2); border:1px solid rgba(201,168,97,.5);
    color:#C9A861; padding:2px 14px; border-radius:14px;
    font-size:11px; font-weight:700; letter-spacing:.5px;
  }
  .pc-qr { background:#fafaf6; padding:12px; text-align:center; border-bottom:1.5px dashed #e0dbd0; }
  .pc-qr img { width:130px; height:130px; border-radius:8px; display:block; margin:0 auto 6px; }
  .pc-scan { font-size:10px; color:#666; }
  .pc-scan strong { color:#651713; }
  .pc-steps { padding:8px 12px; flex:1; }
  .pc-step { display:flex; align-items:flex-start; gap:7px; margin-bottom:5px; font-size:9.5px; line-height:1.45; color:#333; }
  .pc-num { width:16px; height:16px; border-radius:50%; background:#651713; color:#C9A861; font-size:9px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; }
  .pc-footer { background:#651713; color:rgba(255,255,255,.75); font-size:8.5px; text-align:center; padding:5px; }

  /* Grid layouts — การ์ดตั้งตลอด แค่เปลี่ยนจำนวนคอลัมน์ */
  .print-grid { display:grid; gap:6mm; }
  /* Portrait */
  .print-grid.size-a4.portrait  { grid-template-columns:repeat(2,1fr); }
  .print-grid.size-a5.portrait  { grid-template-columns:1fr; max-width:148mm; margin:0 auto; }
  .print-grid.size-a6.portrait  { grid-template-columns:repeat(2,1fr); }
  /* Landscape — กระดาษหมุน จัดได้มากขึ้น */
  .print-grid.size-a4.landscape { grid-template-columns:repeat(3,1fr); }
  .print-grid.size-a5.landscape { grid-template-columns:repeat(2,1fr); }
  .print-grid.size-a6.landscape { grid-template-columns:repeat(3,1fr); }

  /* Card sizes */
  .size-a4 .print-card { min-height:120mm; }
  .size-a5 .print-card { min-height:180mm; }
  .size-a6 .print-card { min-height:80mm; }
  .size-a5 .pc-header img  { height:70px; }
  .size-a5 .pc-hotel       { font-size:20px; }
  .size-a5 .pc-qr img      { width:180px; height:180px; }
  .size-a5 .pc-step        { font-size:11px; margin-bottom:7px; }
  .size-a5 .pc-num         { width:20px; height:20px; font-size:11px; }
  .size-a6 .pc-header img  { height:34px; }
  .size-a6 .pc-hotel       { font-size:12px; }
  .size-a6 .pc-qr img      { width:88px; height:88px; }
  .size-a6 .pc-steps       { display:none; }
  .size-a6 .pc-footer      { display:none; }

  @media print {
    body { background:#fff; }
    .no-print { display:none !important; }
    .page-wrap { padding:0; max-width:none; }
    #printAllView { display:block !important; }
    #tablesContainer { display:none !important; }
    .print-size-bar { display:none !important; }
    .print-header-text { display:none !important; }
    .print-page { margin:0 !important; border:none !important; }
  }
</style>
</head>
<body>

<header class="topbar no-print">
  <div class="topbar-inner">
    <a href="admin.html" class="brand-link" title="กลับหน้าแรก">
      <img src="images/logo-white.png" class="brand-logo-img" alt="Logo">
      
    </a>
    <nav class="topbar-nav">
      <a href="index.html">🏠 หน้าแรก</a><a href="admin.html">ออเดอร์</a>
      <a href="tables.html" class="active">โต๊ะ</a>
      <a href="menu-manage.html">เมนู</a>
      <a href="report.html">📊 รายงาน</a>
    </nav>
  </div>
</header>

<div class="page-wrap">

  <div class="page-head no-print">
    <h1>🪑 จัดการโต๊ะอาหาร</h1>
    <div class="actions">
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
        <span style="font-size:12px;font-weight:700;color:var(--color-muted);">ขนาด:</span>
        <button class="size-btn active" id="sizeA4" onclick="setPaperSize('a4')">A4</button>
        <button class="size-btn" id="sizeA5" onclick="setPaperSize('a5')">A5</button>
        <button class="size-btn" id="sizeA6" onclick="setPaperSize('a6')">A6</button>
        <span style="width:1px;height:22px;background:var(--color-line);display:inline-block;margin:0 4px;"></span>
        <span style="font-size:12px;font-weight:700;color:var(--color-muted);">แนว:</span>
        <button class="size-btn active" id="orPort" onclick="setOrient('portrait')">↕ ตั้ง</button>
        <button class="size-btn" id="orLand" onclick="setOrient('landscape')">↔ นอน</button>
      </div>
      <button class="btn btn-ghost" id="btnSaveAll">💾 บันทึกรูปทุกโต๊ะ</button>
      <button class="btn btn-ghost" id="btnPrintAll">🖨️ ปริ้น QR ทุกโต๊ะ</button>
      <button class="btn btn-primary" id="btnAdd">+ เพิ่มโต๊ะ</button>
    </div>
  </div>

  <div id="tablesContainer" class="tables-grid"></div>

  <!-- View สำหรับปริ้นทุกโต๊ะ -->
  <div id="printAllView"></div>

</div>

<!-- Modal: เพิ่ม/แก้ไขโต๊ะ -->
<div id="tableModal" class="modal-bg" style="display:none;">
  <div class="modal-card">
    <h2 id="modalTitle" style="font-family:'Cormorant Garamond',serif;color:var(--color-emerald);margin-top:0;">เพิ่มโต๊ะใหม่</h2>
    <div class="form-row">
      <label>หมายเลขโต๊ะ *</label>
      <input type="number" id="inpTableNumber" min="1" placeholder="เช่น 1, 2, 11">
    </div>
    <div class="form-row">
      <label>ชื่อโต๊ะ (ไม่บังคับ)</label>
      <input type="text" id="inpTableName" placeholder="เช่น VIP, ระเบียง, ริมสระ">
    </div>
    <div class="form-row">
      <label>จำนวนที่นั่ง</label>
      <input type="number" id="inpSeats" min="1" value="4">
    </div>
    <div class="form-row">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
        <input type="checkbox" id="inpActive" checked> เปิดใช้งานโต๊ะนี้
      </label>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn btn-ghost" id="btnCancel" style="flex:1;">ยกเลิก</button>
      <button class="btn btn-primary" id="btnSave" style="flex:1;">บันทึก</button>
    </div>
  </div>
</div>

<!-- Modal: ดู QR ใหญ่ -->
<div id="qrModal" class="modal-bg" style="display:none;">
  <div class="modal-card" style="text-align:center;max-width:420px;">
    <h2 id="qrModalTitle" style="font-family:'Cormorant Garamond',serif;color:var(--color-emerald);margin-top:0;"></h2>
    <p id="qrModalSub" style="color:var(--color-muted);margin:0 0 16px;"></p>
    <div id="qrModalCanvas" style="display:flex;justify-content:center;padding:16px;background:#fff;border:1px solid var(--color-line);border-radius:12px;margin-bottom:12px;"></div>
    <p style="font-size:13px;color:var(--color-muted);word-break:break-all;" id="qrModalUrl"></p>
    <div style="display:flex;gap:8px;margin-top:12px;">
      <button class="btn btn-ghost" id="btnQrClose" style="flex:1;">ปิด</button>
      <button class="btn btn-primary" id="btnQrDownload" style="flex:1;">🖨️ พิมพ์พร้อมวิธีสั่ง</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/config.js"></script>
<script src="js/admin-pin.js"></script>
<script src="js/api.js"></script>
<script src="js/notifications.js"></script>
<script src="js/tables.js"></script>

</body>
</html>
