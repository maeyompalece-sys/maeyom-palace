<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flash Sale - แม่ยม พาเลส</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  .page-wrap { max-width:1100px; margin:0 auto; padding:24px 16px 80px; }
  .page-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
  .page-head h1 { font-family:'Cormorant Garamond',serif; color:var(--color-emerald); font-size:32px; margin:0; }

  /* Flash sale cards */
  .fs-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
  .fs-card { background:#fff; border-radius:14px; overflow:hidden; box-shadow:0 4px 14px rgba(0,0,0,.06); border-top:4px solid var(--color-gold); position:relative; }
  .fs-card.inactive { opacity:.55; border-top-color:#ccc; }
  .fs-card-img { width:100%; height:160px; background:#fafaf6 center/cover no-repeat; display:flex; align-items:center; justify-content:center; font-size:48px; position:relative; }
  .fs-card-body { padding:14px 16px; }
  .fs-card-name { font-family:'Cormorant Garamond',serif; font-size:20px; font-weight:700; color:var(--color-emerald); margin-bottom:4px; }
  .fs-card-desc { font-size:12px; color:var(--color-muted); margin-bottom:10px; min-height:32px; }
  .fs-price-row { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .fs-price-orig { font-size:14px; color:#aaa; text-decoration:line-through; }
  .fs-price-new { font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:700; color:#dc2626; }
  .fs-discount { background:#dc2626; color:#fff; padding:2px 8px; border-radius:10px; font-size:12px; font-weight:700; }
  .fs-time-row { background:#fafaf6; border-radius:8px; padding:10px 12px; font-size:12px; color:var(--color-muted); margin-bottom:12px; display:flex; flex-direction:column; gap:4px; }
  .fs-time-row span { color:var(--color-emerald); font-weight:600; }
  .fs-countdown { text-align:center; padding:8px; border-radius:8px; margin-bottom:12px; font-weight:700; font-size:14px; }
  .fs-countdown.active { background:linear-gradient(135deg,#dc2626,#b91c1c); color:#fff; }
  .fs-countdown.upcoming { background:#fef3c7; color:#92400e; }
  .fs-countdown.ended { background:#f3f4f6; color:#9ca3af; }
  .fs-card-btns { display:flex; gap:6px; }
  .fs-card-btns button { flex:1; font-size:12px; padding:7px 10px; }
  .badge-active { position:absolute; top:10px; right:10px; background:#16a34a; color:#fff; padding:3px 10px; border-radius:10px; font-size:11px; font-weight:700; }
  .badge-inactive { position:absolute; top:10px; right:10px; background:#6b7280; color:#fff; padding:3px 10px; border-radius:10px; font-size:11px; font-weight:700; }
  .badge-ended { position:absolute; top:10px; right:10px; background:#dc2626; color:#fff; padding:3px 10px; border-radius:10px; font-size:11px; font-weight:700; }

  .empty-state { text-align:center; padding:60px 20px; color:var(--color-muted); grid-column:1/-1; }
  .empty-state .ico { font-size:64px; margin-bottom:12px; }

  /* Modal */
  .modal-card.wide { max-width:600px; }
  .form-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media(max-width:540px){ .form-grid-2 { grid-template-columns:1fr; } }
  .img-preview { width:100%; height:180px; border-radius:10px; background:#fafaf6 center/cover no-repeat; border:1.5px dashed var(--color-line); display:flex; align-items:center; justify-content:center; color:var(--color-muted); margin-bottom:8px; cursor:pointer; transition:border-color .2s; }
  .img-preview:hover { border-color:var(--color-gold); }
  .repeat-row { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .day-chip { padding:5px 12px; border-radius:16px; border:1.5px solid var(--color-line); background:#fff; color:var(--color-emerald); cursor:pointer; font-size:13px; font-weight:600; transition:all .15s; }
  .day-chip.on { background:var(--color-emerald); color:#C9A861; border-color:var(--color-emerald); }
  .section-label { font-size:12px; font-weight:700; color:var(--color-muted); text-transform:uppercase; letter-spacing:.5px; margin:14px 0 6px; }
</style>
</head>
