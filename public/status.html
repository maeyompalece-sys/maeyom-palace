<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0F3B2E">
<title>สถานะออเดอร์ | โรงแรม แม่ยม พาเลส</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">
<link rel="manifest" href="manifest.json">

<style>
  body { padding-bottom:80px; }
  .page-hero { padding:24px 16px 16px; text-align:center; background:linear-gradient(180deg,#0F3B2E 0%,#0a2820 100%); color:#fff; }
  .page-hero h1 { font-family:'Cormorant Garamond',serif; font-size:28px; margin:0 0 4px; color:#C9A861; }
  .page-hero .sub { color:rgba(255,255,255,.7); font-size:13px; }

  .container-page { max-width:680px; margin:0 auto; padding:20px 16px; }

  /* Status header */
  .status-header { text-align:center; margin-bottom:24px; }
  .status-current { display:inline-block; padding:24px 36px; border-radius:18px; border:2px solid; margin-bottom:14px; min-width:240px; }
  .status-icon-lg { font-size:64px; line-height:1; margin-bottom:6px; }
  .status-label-lg { font-family:'Cormorant Garamond',serif; font-size:24px; font-weight:700; }
  .order-meta { color:var(--color-muted); font-size:13px; }
  .order-meta div { margin:2px 0; }

  /* Status timeline */
  .status-timeline { display:flex; justify-content:space-between; align-items:flex-start; padding:24px 0; margin-bottom:20px; position:relative; gap:4px; overflow-x:auto; }
  .status-timeline::before { content:''; position:absolute; top:36px; left:8%; right:8%; height:3px; background:var(--color-line); z-index:0; }
  .timeline-step { flex:1; min-width:60px; text-align:center; position:relative; z-index:1; }
  .step-icon { width:42px; height:42px; border-radius:50%; background:#fff; border:3px solid var(--color-line); display:inline-flex; align-items:center; justify-content:center; font-size:20px; margin-bottom:6px; transition:all .3s; }
  .step-label { font-size:11px; color:var(--color-muted); font-weight:600; }
  .timeline-step.done .step-icon { background:var(--color-emerald); border-color:var(--color-emerald); color:#C9A861; }
  .timeline-step.done .step-label { color:var(--color-emerald); }
  .timeline-step.active .step-icon { background:var(--color-gold); border-color:var(--color-gold); color:#fff; animation:pulse 1.5s ease infinite; transform:scale(1.15); }
  .timeline-step.active .step-label { color:var(--color-gold); font-weight:700; }
  @keyframes pulse {
    0%,100% { box-shadow:0 0 0 0 rgba(201,168,97,.5); }
    50% { box-shadow:0 0 0 12px rgba(201,168,97,0); }
  }

  .status-cancelled { padding:30px; text-align:center; background:#fee; color:#c33; border-radius:14px; font-size:18px; font-weight:700; margin-bottom:20px; }

  /* Customer info */
  .customer-info { background:#fff; border-radius:12px; padding:14px 18px; margin-bottom:16px; border:1px solid var(--color-line); display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px; }

  /* Items section */
  .items-section { background:#fff; border-radius:14px; padding:18px; box-shadow:0 2px 8px rgba(0,0,0,.04); margin-bottom:16px; }
  .items-section h3 { font-family:'Cormorant Garamond',serif; color:var(--color-emerald); margin:0 0 12px; font-size:20px; }
  .order-item-row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--color-line); }
  .order-item-row:last-of-type { border-bottom:none; }
  .order-item-note { font-size:12px; color:var(--color-muted); padding-left:12px; font-style:italic; }
  .order-notes-display { background:#fff7ed; border-left:3px solid #f59e0b; padding:8px 12px; border-radius:6px; font-size:13px; color:#92400e; margin:10px 0; }
  .total-row { display:flex; justify-content:space-between; padding:12px 0; border-top:2px solid var(--color-gold); margin-top:10px; font-family:'Cormorant Garamond',serif; font-size:22px; }
  .total-row strong { color:var(--color-gold); font-weight:700; }

  /* Action buttons */
  .actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; }
  .actions .btn { padding:12px; }
  .actions .full { grid-column:1/-1; }

  .spinner { width:50px; height:50px; border:5px solid #e5e5e0; border-top-color:var(--color-gold); border-radius:50%; animation:spin 0.8s linear infinite; margin:40px auto; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* 📌 Sticky Status Bar - แสดงด้านบนตลอดเวลา */
  #stickyStatusBar {
    display:none;
    position:fixed; top:0; left:0; right:0; z-index:999;
    padding:0; margin:0;
    box-shadow:0 2px 16px rgba(0,0,0,.18);
    transition:all .4s ease;
    -webkit-backdrop-filter:blur(12px);
    backdrop-filter:blur(12px);
  }
  .sticky-bar-inner {
    display:flex; align-items:center; gap:10px;
    padding:10px 16px; max-width:680px; margin:0 auto;
  }
  .sticky-bar-icon { font-size:24px; flex-shrink:0; }
  .sticky-bar-text { flex:1; min-width:0; }
  .sticky-bar-title { font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sticky-bar-sub { font-size:11px; opacity:.8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sticky-bar-progress {
    height:3px; width:100%;
    background:rgba(255,255,255,.2);
    position:relative; overflow:hidden;
  }
  .sticky-bar-progress-fill {
    height:100%; background:rgba(255,255,255,.8);
    transition:width .5s ease;
    position:absolute; left:0; top:0;
  }
  .sticky-bar-btn {
    padding:6px 12px; border-radius:20px;
    background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.4);
    color:#fff; font-size:12px; font-weight:600; cursor:pointer;
    white-space:nowrap; flex-shrink:0;
  }
  .sticky-bar-btn:hover { background:rgba(255,255,255,.35); }
  body.has-sticky-bar { padding-top:64px; }

  @keyframes slideDown {
    from { transform:translateY(-100%); opacity:0; }
    to { transform:translateY(0); opacity:1; }
  }
  .sticky-bar-enter { animation:slideDown .3s ease forwards; }
</style>
</head>
<body>

<!-- 📌 Sticky Status Bar -->
<div id="stickyStatusBar">
  <div class="sticky-bar-inner">
    <div class="sticky-bar-icon" id="stickyBarIcon">⏳</div>
    <div class="sticky-bar-text">
      <div class="sticky-bar-title" id="stickyBarTitle">กำลังโหลด...</div>
      <div class="sticky-bar-sub" id="stickyBarSub">แม่ยม พาเลส</div>
    </div>
    <button class="sticky-bar-btn" id="stickyBarBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">ดูสถานะ</button>
  </div>
  <div class="sticky-bar-progress">
    <div class="sticky-bar-progress-fill" id="stickyBarProgress" style="width:0%"></div>
  </div>
</div>



<div class="page-hero">
  <h1>โรงแรม แม่ยม พาเลส</h1>
  <div class="sub">📊 ติดตามสถานะออเดอร์ของคุณ</div>
</div>

<main class="container-page">

  <div id="statusLoading" style="text-align:center;padding:40px 20px;">
    <div class="spinner"></div>
    <p style="color:var(--color-muted);">กำลังโหลดออเดอร์...</p>
  </div>

  <div id="statusContent" style="display:none;"></div>

  <div class="actions">
    <button class="btn btn-ghost" id="btnAddMore">➕ สั่งเพิ่ม</button>
    <button class="btn btn-ghost" id="btnCall">📞 โทรหาแอดมิน</button>
    <button class="btn btn-primary full" id="btnHome">🏠 กลับหน้าแรก</button>
  </div>

</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/notifications.js"></script>
<script src="js/push.js"></script>
<script src="js/status.js"></script>

</body>
</html>
